<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      
      <div class="content-box">
        <!-- Add your devotional content here -->
         <h2>BYU-IDAHO SPEECHES</h2>
         <h1>Favorite Devotionals</h3>
         <h3>Explore messages shared in the BYU-Idaho community.</h2>
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
            <tr>
              <td>Elder Bednar</td>
              <td>Bednar</td>
              <td>Bednar</td>
              <td>2026</td>
            </tr>

          <tr>
            <td>Bednar</td>
            <td>Bednar</td>
            <td>Bednar</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Bednar</td>
            <td>Bednar</td>
            <td>Bednar</td>
            <td>2026</td>
          </tr>

        </table>
         <form class="add">
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" placeholder="Enter name">
          <label for="title">Title:</label>
          <input type="text" id="title" placeholder="Enter title">
          <label for="location">Location:</label>
          <input type="text" id="location" placeholder="Enter location">
          <label for="year">Year:</label>
          <input type="number" id="year" placeholder="Enter year">
          <button>Add Devotional</button>

         </form>
      </div>
    </main>
  </div>
</body>
</html>
