<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
</head>
<style>
    .post{
        display: grid;
        width: 500px;
        height: 600px;

    }
    .top img{
        width: 50px;
        height: 50px;
        border: 1px solid black;
        border-radius: 300px;
        display: flex;
        align-items: center;
    }
    .main_post img{
        width: 500px;
        height: 600px;
        object-fit: cover;
    }
    .top, .bottom{
        display: block;
        text-align: right;
        width: 100%;
    }

</style>
<body>
    <div class="post">
        <div class="top">
            <img src="oaks.webp" alt="profile pic">
            <span>Heitor</span>
            <span>20 min</span>
            <span class="material-icons">more_vert</span>
        </div>
        <div class="main_post">
            <img src="main.jpg" alt="main post">
        </div>
        <div class="bottom">
            <span class="material-icons">bookmark</span>
            <span class="material-icons">share</span>
            <span class="material-icons">chat_bubble_outline</span>
            <span>125</span>
            <span>850</span>
            <span class="material-icons">favorite</span>
        </div>
    </div>
</span>
</body>
</html>
