<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apostles Spotlights</title>
    <style>
        /* Insert styles here */
        body{
            background-color: #e8eced;
        }
        h1, h2{
            text-align: center;
            color: white;
            font-family: Arial;
            margin: 0 auto;
            padding-bottom: 10px;
        }
        .card{
            background-image: url(images/christus.webp);
            margin: 0 auto;
            border: 5px solid black;
            border-radius: 20px;
            background-size: cover;
            background-position: 60%;
            width: 700px;
            height: 550px;

        }
        .presidency{
            display: grid;
            grid-template-columns: repeat(3, 140px);
            justify-content: center;
            align-items: center;
        }
        
        
        .quorum {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            justify-content: center;
            align-items: center;
            row-gap: 25px;
            
            
        }
        .presidency img:nth-child(2){
            width: 110px;
            height: 110px;

        }
        .presidency img{
            width: 100px;
            height: 100px;
            object-fit:cover;
            border: 5px solid white;
            border-radius: 300px;
        
        }
        .quorum img{
            width: 75px;
            height: 75px;
            object-fit:cover;
            border: 5px solid white;
            border-radius: 45px;
            padding-top: 1px;
        }
        h1{
            font-size: 35px;
            font-weight: 10;
        }
        h2{
            font-size: 20px;
            font-weight: 10;
            padding-top: 10px;
        }


    </style>
</head>
<body>
    <!-- Insert HTML elements here -->
     <div class="card">
        <h1>First Presidency</h1>
        <div class="presidency">
            <img src="images/eyring.webp" alt="Eyring">
            <img src="images/oaks.webp" alt="Oaks">
            <img src="images/christofferson.webp" alt="Christofferson">

        </div>
        <h2>Quorum of the Twelve Apostles</h2>
        <div class="quorum">
            <img src="images/uchtdorf.webp" alt="Utchdorf">
            <img src="images/bednar.webp" alt="Bednar">
            <img src="images/cook.webp" alt="Cook">
            <img src="images/anderson.webp" alt="Andersen">
            <img src="images/rasband.webp" alt="Rasband">
            <img src="images/stevenson.webp" alt="Stevenson">
            <img src="images/renlund.webp" alt="Renlund">
            <img src="images/gong.webp" alt="Gong">
            <img src="images/soares.webp" alt="Soares">
            <img src="images/kearon.webp" alt="Kearon">
            <img src="images/causse.webp" alt="Causse">
            <img src="images/gilbert.webp" alt="Gilbert">

        </div>



     </div>
</body>
</html>
