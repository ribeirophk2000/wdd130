
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }

        #formContainer {
            width: 500px;
            background-color: white;
            border: 10px solid darkblue;
            border-radius: 30px;
            margin: 20px auto;
            overflow: hidden;
        }

        #banner {
            position: relative;
        }

        .banner {
            width: 100%;
            height: 210px;
            object-fit: cover;
            object-position: center 40%;
            display: block;
        }

        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
        }

        h3 {
            text-align: center;
            padding: 15px;
        }

        #myForm {
            padding: 15px 25px 25px;
        }

        .formRow {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }

        .formRow input {
            padding: 5px;
        }

        .genderOptions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkRow {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 12px;
        }

        #myForm button[type="submit"] {
            padding: 5px 12px;
        }

        #bookImages {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 5px;
        }

        #bookImages img {
            width: 100%;
            height: 125px;
        }
    </style>

</head>

<body>

    <div id="formContainer">

        <div id="banner">
            <img class="banner" src="images/jesus_feeds_5000.jpeg" alt="Jesus feeding the people">
            <button type="button" id="closeBtn">X</button>
        </div>

        <h3>Sign Up for Daily Scripture Feed</h3>

        <form id="myForm">

            <div class="formRow">
                <label for="username">User Name:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="formRow">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="formRow">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="formRow">
                <label>Gender:</label>
                <div class="genderOptions">
                    <input type="radio" id="male" name="gender" value="male" required>
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>
                </div>
            </div>

            <div class="checkRow">
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </div>

            <div class="checkRow">
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </div>

            <button type="submit">Submit</button>

        </form>

        <div id="bookImages">

            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">

        </div>

    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
        });

        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
        });
    </script>

</body>

</html>
